name: WorldPulse Robot

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 minutos
  workflow_dispatch:           # permite disparo manual

permissions:
  actions: write   # necessário para o passo de keepalive

jobs:
  run-robot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Disparar robô de notícias
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.SITE_URL }}/api/robot" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"maxSources": 6, "maxItemsPerSource": 8}' \
            --max-time 420)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Robot failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Robot completed successfully"
          echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Processed:',d.get('processed',0)); print('Published:',d.get('published',0)); print('Pending:',d.get('pending',0))" 2>/dev/null || true

      - name: Keepalive — impede desativação por inatividade (60 dias)
        if: always()
        run: |
          curl -s -o /dev/null -w "keepalive HTTP: %{http_code}\n" -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/robot.yml/enable"
